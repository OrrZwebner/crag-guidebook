name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# tests/run_tests.py parses each script's JSON output and compares it with
# tests/expected.json (hand-derived). Times/counts compare exactly; coordinates
# (photo GPS) compare to 4 decimal places (~1e-4 deg).

jobs:
  stdlib:
    name: Standard library only (HTML fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/run_tests.py

  pdf:
    name: Full (WeasyPrint PDF + mode-C round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - run: pip install weasyprint pymupdf pillow
      - run: python tests/run_tests.py
