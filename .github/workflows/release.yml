name: release

# Packages the skill on its own and attaches it to the release, so a user can
# download one file and upload it. GitHub's own "Download ZIP" is not usable
# for this: it contains the whole repository, which buries SKILL.md a level
# deeper than the uploader expects.
#
# The skill folder sits at the repository root: crag-guidebook/SKILL.md.
# The archive's top level is therefore crag-guidebook/SKILL.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SKILL_NAME: crag-guidebook

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the skill archive
        run: |
          zip -r "${SKILL_NAME}.zip" "${SKILL_NAME}" \
            -x '*.DS_Store' '*__pycache__*' '*.pyc' \
               "${SKILL_NAME}/tests/*" "${SKILL_NAME}/notes/*"

      - name: Verify the archive layout
        run: |
          unzip -l "${SKILL_NAME}.zip"
          listing="$(unzip -Z1 "${SKILL_NAME}.zip")"
          # SKILL.md must sit directly inside one top-level folder, or the
          # upload will not be recognized as a skill.
          grep -qx "${SKILL_NAME}/SKILL.md" <<<"$listing" \
            || { echo "::error::SKILL.md is not at ${SKILL_NAME}/SKILL.md"; exit 1; }
          # exactly one top-level entry
          tops="$(cut -d/ -f1 <<<"$listing" | sort -u)"
          [ "$tops" = "${SKILL_NAME}" ] \
            || { echo "::error::unexpected top-level entries: $tops"; exit 1; }
          # nothing that should never ship
          if grep -Eq '__pycache__|\.pyc$|\.DS_Store|/tests/|/notes/' <<<"$listing"; then
            echo "::error::archive contains excluded files"; exit 1
          fi
          # every reference, script and asset in the tree must be present
          n=0
          while IFS= read -r f; do
            grep -qx "$f" <<<"$listing" \
              || { echo "::error::missing from archive: $f"; exit 1; }
            n=$((n+1))
          done < <(find "${SKILL_NAME}/references" "${SKILL_NAME}/scripts" "${SKILL_NAME}/assets" \
                     -type f ! -name '*.pyc' ! -path '*__pycache__*' ! -name '.DS_Store')
          echo "verified $n reference/script/asset files"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${SKILL_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Ready-to-upload skill archive. Download \`${SKILL_NAME}.zip\` below (don't unzip it) and upload it in your AI app's skills settings. See the README." \
            || gh release upload "$GITHUB_REF_NAME" "${SKILL_NAME}.zip" --clobber
